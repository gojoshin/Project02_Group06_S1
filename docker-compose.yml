services:
  moviebox-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - RENDER_DB_HOST=${RENDER_DB_HOST:-localhost}
      - RENDER_DB_NAME=${RENDER_DB_NAME:-moviebox_db}
      - RENDER_DB_USER=${RENDER_DB_USER:-postgres}
      - RENDER_DB_PASSWORD=${RENDER_DB_PASSWORD}
      - TMDB_API_KEY=${TMDB_API_KEY}
    restart: unless-stopped
