spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: jdbc:postgresql://${RENDER_DB_HOST:localhost}:${RENDER_DB_PORT:5432}/${RENDER_DB_NAME:moviebox_db}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${RENDER_DB_USER:postgres}
    password: ${RENDER_DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
