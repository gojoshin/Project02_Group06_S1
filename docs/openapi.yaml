# Starter OpenAPI contract for CST 438 Project 02.
# Copy to docs/openapi.yaml in your repo, then replace Workout/Exercise with YOUR resources.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: TV Show Tracker API
  version: 1.0.0
  description: |
    API for tracking TV shows, episodes, and user watch progress.
    Every error uses RFC 9457 Problem Details (see components/schemas/Problem).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 06
    url: https://github.com/gojoshin/Project02_Group06_S1

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Shows
    description: TV shows catalog and progress
  - name: Episodes
    description: TV show episodes and watch status
  - name: Reviews
    description: User reviews for movies and shows
  - name: Users
    description: The signed-in user's own account
  - name: Admin
    description: Admin-only user management

paths:
  /api/v1/movies/{movieId}/streaming:
    parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 15
    get:
      tags: [Movies]
      operationId: getMovieStreaming
      summary: Get streaming providers for a movie
      description: Returns a list of streaming services where the movie is available to watch in the US.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: A list of streaming providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamingProvider'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/movies/{movieId}/reviews:
    parameters:
      - name: movieId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 15
    get:
      tags: [Reviews]
      operationId: getMovieReviews
      summary: Get reviews for a movie
      description: Returns a list of reviews for a specific movie, optionally paginated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: A page of reviews for the requested movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/reviews:
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Create a personal review for a movie or show
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created
          headers:
            Location:
              description: URL of the new review
              schema:
                type: string
                example: /api/v1/reviews/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/reviews/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 42
    put:
      tags: [Reviews]
      operationId: updateReview
      summary: Edit a personal review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shows/{showId}/episodes:
    parameters:
      - name: showId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 100
    get:
      tags: [Shows, Episodes]
      operationId: getShowEpisodes
      summary: Get episodes for a show
      description: Returns a list of all episodes for a specific TV show, optionally paginated.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: A page of episodes for the requested show
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/episodes/{episodeId}/status:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 404
    put:
      tags: [Episodes]
      operationId: updateEpisodeStatus
      summary: Mark an episode as watched or unwatched
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeStatusUpdate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: The updated episode status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Episode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shows/{showId}/progress:
    parameters:
      - name: showId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 100
    get:
      tags: [Shows]
      operationId: getShowProgress
      summary: Get user progress for a show
      description: Returns the user's progress for a specific TV show, including watched episodes and seasons.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: The user's progress for the show
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shows/{showId}/streaming:
    parameters:
      - name: showId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 100
    get:
      tags: [Shows]
      operationId: getShowStreaming
      summary: Get streaming providers for a TV show
      description: Returns a list of streaming services where the show is available to watch in the US.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: A list of streaming providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamingProvider'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me:
    delete:
      tags: [Users]
      operationId: deleteMyAccount
      summary: Delete my own account and ALL my data
      description: Any signed-in user. Deletes the user row and everything they own.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted. The token is now useless.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users (admin only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 7
    get:
      tags: [Admin]
      operationId: getUser
      summary: View one user (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: Grant or revoke admin (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and all their data (admin only)
      description: Requires the ADMIN role. A USER token gets 403.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Episode:
      type: object
      required: [id, showId, seasonNumber, episodeNumber, title, watched]
      properties:
        id:
          type: integer
          format: int64
          example: 404
        showId:
          type: integer
          format: int64
          example: 100
        seasonNumber:
          type: integer
          example: 1
        episodeNumber:
          type: integer
          example: 1
        title:
          type: string
          example: Pilot
        watched:
          type: boolean
          description: Whether the signed-in user has watched this episode
          example: false

    EpisodePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
        page:
          $ref: '#/components/schemas/PageMeta'

    EpisodeStatusUpdate:
      type: object
      required: [watched]
      properties:
        watched:
          type: boolean
          description: Set to true if watched, false if unwatched
          example: true

    ShowProgress:
      type: object
      required: [showId, totalEpisodes, watchedEpisodes, seasons]
      properties:
        showId:
          type: integer
          format: int64
          example: 100
        totalEpisodes:
          type: integer
          example: 62
        watchedEpisodes:
          type: integer
          example: 12
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeasonProgress'

    SeasonProgress:
      type: object
      required: [seasonNumber, totalEpisodes, watchedEpisodes]
      properties:
        seasonNumber:
          type: integer
          example: 1
        totalEpisodes:
          type: integer
          example: 10
        watchedEpisodes:
          type: integer
          example: 10

    PageMeta:
      description: >-
        Spring Data's PagedModel shape. Turn it on with
        spring.data.web.pageable.serialization-mode=via_dto in application.properties.
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    Review:
      type: object
      required: [id, mediaId, mediaType, userId, rating, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        mediaId:
          type: integer
          format: int64
          example: 15
        mediaType:
          type: string
          enum: [MOVIE, SHOW]
          example: MOVIE
        userId:
          type: integer
          format: int64
          example: 7
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        content:
          type: string
          example: "Great movie, really enjoyed the cinematography!"
        createdAt:
          type: string
          format: date-time
          example: '2026-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-02T15:30:00Z'

    ReviewCreate:
      type: object
      required: [mediaId, mediaType, rating, content]
      properties:
        mediaId:
          type: integer
          format: int64
          example: 15
        mediaType:
          type: string
          enum: [MOVIE, SHOW]
          example: MOVIE
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        content:
          type: string
          maxLength: 1000
          example: "Great movie, really enjoyed the cinematography!"

    ReviewUpdate:
      type: object
      required: [rating, content]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        content:
          type: string
          maxLength: 1000
          example: "On second thought, it was a masterpiece!"

    ReviewPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        page:
          $ref: '#/components/schemas/PageMeta'

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        email:
          type: string
          format: email
          example: sam@csumb.edu
        displayName:
          type: string
          example: Sam Otter
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [USER, ADMIN]

    UserPatch:
      description: Body for PATCH /api/v1/users/{userId}. Today the only editable field is the role.
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Item 42 not found
        instance:
          type: string
          example: /api/v1/resource/42

    StreamingProvider:
      type: object
      required: [providerId, name, logoPath]
      properties:
        providerId:
          type: integer
          format: int64
          example: 8
        name:
          type: string
          example: Netflix
        logoPath:
          type: string
          example: /t2yyOv40HZeVlLjYsCsPHnWLk4W.jpg

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Resource 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
